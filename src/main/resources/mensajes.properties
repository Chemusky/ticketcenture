# ============================
#        ERRORES
# ============================

# ---- LOGIN / USUARIO ----
ERROR_USUARIO_INCORRECTO=Email o contraseña incorrectos
ERROR_LOGIN_FALLIDO_MAIL_INEXISTENTE=Login fallido, mail inexistente
ERROR_LOGIN_FALLIDO_PASSWORD=Login fallido, password incorrecta
ERROR_LOGIN_BLOQUEADO=Cuenta temporalmente bloqueada. Inténtelo de nuevo más tarde

ERROR_EMAIL_NO_EXISTE=No existe ese email
ERROR_EMAIL_YA_EXISTE=Ya existe un usuario con ese email
ERROR_USERNAME_YA_EXISTE=El nombre de usuario ya está en uso

ERROR_PASSWORD_VACIA=La contraseña no puede estar vacía
ERROR_PASSWORD_CORTA=La contraseña debe tener al menos 8 caracteres
ERROR_PASSWORD_NO_COINCIDEN=Las contraseñas no coinciden
ERROR_VALIDAR_CODIGO=Debes validar el código antes de cambiar la contraseña
ERROR_PASSWORD_ACTUAL_INCORRECTA=La contraseña actual no es correcta

ERROR_USUARIO_NO_ENCONTRADO=No se encuentra al usuario
ERROR_USUARIO_ID_NO_EXISTE=No existe un usuario con ese ID

ERROR_PERMISO_ADMIN=No tienes permiso para realizar esta operación

# ----- GESTION DE USUARIOS ------
ERROR_ACTUALIZAR_USUARIO=No se pudo actualizar el usuario. Inténtalo de nuevo.
ERROR_USUARIO_INEXISTENTE=El usuario no existe
ERROR_USUARIO_CON_COMPRAS=No se puede eliminar un usuario con compras asociadas.


# ---- ACTIVIDADES / FECHAS ----
ERROR_FECHA_FIN_MAYOR=La fecha fin debe ser mayor que la fecha inicio
ERROR_SIN_ACTIVIDADES=No se encontraron actividades en ese rango de fechas
ERROR_FORMATO_FECHA=Formato de fecha inválido
ERROR_FECHAS_VACIAS=Debes introducir al menos una fecha

# ---- GÉNERO ----
ERROR_GENERO_NULO=El género no puede ser nulo
ERROR_GENERO_NOMBRE_VACIO=El nombre del género es obligatorio
ERROR_GENERO_NOMBRE_CORTO=El nombre del género debe tener al menos 3 caracteres
ERROR_GENERO_NOMBRE_LARGO=El nombre del género no puede superar los 50 caracteres
ERROR_GENERO_DUPLICADO=Ya existe un género con ese nombre
ERROR_GENERO_NO_ENCONTRADO=No se encontró el género solicitado
ERROR_GENERO_NO_ELIMINABLE=No se puede eliminar el género porque tiene grupos asociados.


# ---- GRUPO ----
ERROR_GRUPO_INCORRECTO=Los datos del grupo no son válidos
ERROR_GRUPO_ID_NO_EXISTE=No existe un grupo con ese ID
ERROR_GRUPO_YA_EXISTE=Ya existe un grupo con ese nombre
ERROR_GRUPO_NO_ENCONTRADO=No se encontró el grupo solicitado
ERROR_GRUPO_NO_ELIMINABLE=No se puede eliminar un grupo con entradas vendidas
ERROR_GRUPO_SIN_PERMISOS=No tienes permisos para realizar esta acción
ERROR_GRUPO_NOMBRE_VACIO=El nombre del grupo es obligatorio

# ---- FAVORITOS ----
ERROR_FAVORITO_YA_EXISTE=El grupo ya está en tus favoritos
ERROR_FAVORITO_NO_EXISTE=Este grupo no está en tus favoritos

# ---- GALERÍA / IMÁGENES ----
ERROR_IMAGEN_VACIA=La imagen no puede estar vacía
ERROR_IMAGEN_NO_ENCONTRADA=No se encontró la imagen solicitada
ERROR_IMAGEN_TAMANO_EXCESIVO=La imagen supera el tamaño máximo permitido
ERROR_IMAGEN_FORMATO=El formato de la imagen debe ser jpeg o jpg o png

# ---- EVENTO ----
ERROR_EVENTO_INCORRECTO=Los datos del evento no son válidos
ERROR_EVENTO_ID_NO_EXISTE=No existe un evento con ese ID
ERROR_EVENTO_YA_EXISTE=Ya existe un evento con ese nombre
ERROR_EVENTO_NO_ENCONTRADO=No se encontró el evento solicitado
ERROR_EVENTO_NO_MODIFICABLE=No se puede modificar un evento con entradas vendidas
ERROR_EVENTO_NO_ELIMINABLE=No se puede eliminar un evento con entradas vendidas
ERROR_EVENTO_NO_DESACTIVABLE=No se puede desactivar un evento con entradas vendidas
ERROR_EVENTO_SIN_PERMISOS=No tienes permisos para realizar esta acción
ERROR_EVENTO_NOMBRE_VACIO=El nombre del evento es obligatorio

ERROR_EVENTO_SIN_BUTACAS=El evento debe tener butacas configuradas
ERROR_EVENTO_FILAS_INVALIDAS=El número de filas debe ser mayor que 0
ERROR_EVENTO_ASIENTOS_INVALIDOS=El número de asientos debe ser mayor que 0
ERROR_EVENTO_TIPO_ASIENTO_NULO=Cada butaca debe tener un tipo de asiento configurado



# ------------- ENTRADAS/CARRITO/PROMOCIONES/DESCUENTOS ------------------
ERROR_FECHAS_NULAS=Las fechas de validez no pueden ser nulas
ERROR_ORDEN_FECHAS=La fecha de inicio debe ser anterior a la fecha de fin
ERROR_PROMOCION_COINCIDENTE=Ya existe otra promoción para este evento en un periodo coincidente
ERROR_CODIGO_UNICO_EVENTO=Ya existe una promoción con ese código para este evento
ERROR_DESCUENTO_COINCIDENTE=Ya existe un descuento para este tipo de usuario en un periodo coincidente
ERROR_DESCUENTO_NO_EXISTE=El descuento no existe
ERROR_PROMOCION_NO_EXISTE=La promoción no existe
ERROR_EVENTO_CADUCADO=No puedes comprar entradas de un evento que ya ha pasado


# --------------- NOTICIAS -----------------------
ERROR_NOTICIA_NO_ENCONTRADA=No se encuentra la noticia




