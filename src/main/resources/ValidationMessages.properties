# =========================
# Validaciones de Usuario
# =========================

# Nombre
usuario.nombre.notblank=El nombre es obligatorio
usuario.nombre.size=El nombre no puede superar los 30 caracteres

# Apellidos
usuario.apellidos.notblank=Los apellidos son obligatorios
usuario.apellidos.size=Los apellidos no pueden superar los 50 caracteres

# Teléfono
usuario.telefono.notnull=El teléfono es obligatorio
usuario.telefono.min=El teléfono debe tener al menos 9 dígitos
usuario.telefono.max=El teléfono no puede superar los 9 dígitos
typeMismatch.usuario.telefono=El teléfono debe contener solo números

# DNI
usuario.dni.notblank=El DNI es obligatorio
usuario.dni.pattern=El DNI debe tener 8 números seguidos de una letra válida
usuario.dni.size=El DNI debe tener exactamente 9 caracteres
usuario.dni.invalid=El DNI no corresponde con la letra de control
typeMismatch.usuario.dni=El DNI debe ser un valor válido

# Username
usuario.username.notblank=El nombre de usuario es obligatorio
usuario.username.size=El nombre de usuario no puede superar los 30 caracteres
typeMismatch.usuario.username=El nombre de usuario no es válido

# Email
usuario.email.notblank=El email es obligatorio
usuario.email.email=El email debe tener un formato válido (ejemplo: usuario@dominio.com)
usuario.email.size=El email no puede superar los 200 caracteres
typeMismatch.usuario.email=El email no es válido

# Password
usuario.password.notblank=La contraseña es obligatoria
usuario.password.size=La contraseña debe tener entre 8 y 255 caracteres
usuario.password.pattern=La contraseña debe incluir mayúsculas, minúsculas, números y un carácter especial
typeMismatch.usuario.password=La contraseña no es válida

# =========================
# Validaciones de Direccion
# =========================

# Calle
direccion.calle.notblank=La calle es obligatoria
direccion.calle.size=La calle no puede superar los 100 caracteres

# Número
direccion.numero.notblank=El número de la dirección es obligatorio

# Código Postal
direccion.codigoPostal.notnull=El código postal es obligatorio
direccion.codigoPostal.min=El código postal debe tener al menos 4 dígitos
direccion.codigoPostal.max=El código postal no puede superar 5 dígitos
typeMismatch.usuario.direcciones[0].codigoPostal=El código postal debe contener solo números válidos (máximo 5 dígitos)
typeMismatch.usuario.direcciones[1].codigoPostal=El código postal debe contener solo números válidos (máximo 5 dígitos)

# Localidad
direccion.localidad.notblank=La localidad es obligatoria

# Provincia
direccion.provincia.notblank=La provincia es obligatoria

# Noticia
noticia.titulo.obligatorio=El título es obligatorio
noticia.titulo.max=El título no puede superar 255 caracteres

noticia.cuerpo.obligatorio=El cuerpo de la noticia es obligatorio

noticia.enlace.max=El enlace no puede superar 500 caracteres

noticia.publicado.obligatorio=Debe indicar si la noticia está publicada o no

